name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Release Static Binary
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Static Binary
        run: |
          # Build the image
          docker build -t retrofits-static -f Dockerfile.static .
          
          # Extract the binary from the scratch image
          docker create --name temp-retrofits retrofits-static
          docker cp temp-retrofits:/retrofits ./retrofits-linux-x86_64
          docker rm temp-retrofits
          
          # Generate a checksum for verification
          sha256sum retrofits-linux-x86_64 > retrofits-linux-x86_64.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            retrofits-linux-x86_64
            retrofits-linux-x86_64.sha256
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
